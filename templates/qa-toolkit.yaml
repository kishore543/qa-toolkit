# qa-toolkit settings for one project.
# Copy this file into the root folder of the project you are testing,
# then change the example URLs to your real ones.
#
# NEVER put passwords, OTPs or tokens in this file.

project: My Project

# Websites that tests are ALLOWED to open.
# "*.example.com" means any sub-domain, e.g. qa.example.com, dev.example.com
allowed_hosts:
  - staging.example.com
  - qa.example.com
  - localhost

# Websites LOAD TESTS may hit (many users at once). Stricter: a site must be here AND above.
# Only your own staging/QA servers, and tell the developers before every run.
# Never a public site you don't own. If this list is missing, only localhost is allowed.
load_test_hosts:
  - localhost

# Websites SECURITY CHECKS may test. Stricter: a site must be here AND in allowed_hosts.
# Only sites your team owns, QA/staging only, and tell the developers first.
# If this list is missing, only localhost is allowed.
security_test_hosts:
  - localhost

# Websites that are ALWAYS refused, even if listed above. Put production here.
blocked_hosts:
  - example.com
  - www.example.com

# Jira, for /qa-toolkit:bug (optional). No secrets here - the login goes in .env:
#   JIRA_BASE_URL=https://your-company.atlassian.net
#   JIRA_EMAIL=you@company.com
#   JIRA_API_TOKEN=...   (https://id.atlassian.com/manage-profile/security/api-tokens)
# jira:
#   project_key: ABC      # letters before the dash, e.g. ABC-123
#   issue_type: Bug
#   labels: [my-project]
#   env_file: .env

# Release dashboard rules, for /qa-toolkit:release (optional - these are the defaults):
# release:
#   required: [functional]                  # must be tested: functional, api, browsers, a11y, load, security
#   block_on_bug_priority: [critical, high] # possible app bug on these priorities = blocker
#   a11y_block_on: critical                 # or serious
#   max_age_days: 7                         # older results count as a risk

# Smart regression (/qa-toolkit:smart): smoke tests that always run (optional)
# smart:
#   always: [TC-01]
#
# Test data cleanup (/qa-toolkit:data): how to delete each kind of record tests create (optional)
# test_data:
#   cleanup:
#     task: {method: DELETE, url: "https://staging.example.com/api/tasks/{id}", token_env: API_TOKEN}
